version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    # Include transitive dependencies, such as native build helpers.
    allow:
      - dependency-type: all
    open-pull-requests-limit: 5
    groups:
      rust-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
        # Review cryptographic and hardware-authentication updates individually.
        exclude-patterns:
          - "aead"
          - "chacha20*"
          - "poly1305"
          - "cipher"
          - "crypto-common"
          - "hkdf"
          - "sha2"
          - "zeroize"
          - "getrandom"
          - "openssl*"
          - "libfido2*"
          - "fido2*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    groups:
      actions-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
