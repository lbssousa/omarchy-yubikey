# Optional mkinitcpio drop-in. Read docs/luks.md before installing this file.
# Transform the effective hook list, retaining hardware choices such as kms.
# Unknown runtime hooks need manual review; never silently drop them.
_omarchy_yubikey_luks_hooks() {
  local hook replacement
  local -a converted=()
  for hook in "${HOOKS[@]}"; do
    case "$hook" in
      udev) replacement=systemd ;;
      encrypt) replacement=sd-encrypt ;;
      keymap|consolefont) replacement=sd-vconsole ;;
      btrfs-overlayfs) replacement=sd-btrfs-overlayfs ;;
      shutdown) replacement=sd-shutdown ;;
      resume) continue ;; # systemd handles resume via the existing kernel cmdline
      base|systemd|autodetect|microcode|modconf|kms|keyboard|sd-vconsole|block|sd-encrypt|filesystems|fsck|sd-btrfs-overlayfs|plymouth|sd-shutdown|strip)
        replacement=$hook ;;
      *) printf '%s\n' 'Omarchy YubiKey: unsupported initramfs hook; review docs/luks.md.' >&2; return 1 ;;
    esac
    if [[ " ${converted[*]} " != *" $replacement "* ]]; then
      converted+=("$replacement")
    fi
  done
  local required index systemd_index=-1 block_index=-1 encrypt_index=-1 filesystems_index=-1
  for required in systemd block sd-encrypt filesystems; do
    if [[ " ${converted[*]} " != *" $required "* ]]; then
      printf '%s\n' 'Omarchy YubiKey: incomplete initramfs hooks; review docs/luks.md.' >&2
      return 1
    fi
  done
  for index in "${!converted[@]}"; do
    case "${converted[$index]}" in
      systemd) systemd_index=$index ;;
      block) block_index=$index ;;
      sd-encrypt) encrypt_index=$index ;;
      filesystems) filesystems_index=$index ;;
    esac
  done
  if (( systemd_index >= encrypt_index || block_index >= encrypt_index || encrypt_index >= filesystems_index )); then
    printf '%s\n' 'Omarchy YubiKey: unsafe initramfs hook order; review docs/luks.md.' >&2
    return 1
  fi
  HOOKS=("${converted[@]}")
}
_omarchy_yubikey_luks_hooks || return 1
unset -f _omarchy_yubikey_luks_hooks
