# Insert before existing auth rules in sudo or polkit-1; preserve the rest.
# Enroll with the same origin/appid and a configured FIDO2 PIN.
# Build/install the fallback gate first; it only permits the following password
# stack after confirmation. It must NEVER be sufficient or used on its own.
auth sufficient pam_u2f.so cue origin=pam://omarchy appid=pam://omarchy authfile=/etc/fido2/fido2 pinverification=1 userpresence=1
auth requisite /usr/local/lib/security/pam_omarchy_fallback.so
